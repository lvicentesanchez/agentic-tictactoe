[project]
name = "agentic-tictactoe"
version = "0.1.0"
description = "Modern Tic-Tac-Toe game with AI and web interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "pydantic-settings>=2.0.0",
    "flask-restx>=1.3.0",
    "flask-cors>=4.0.0",
    "redis>=5.0.0",
    "flask-caching>=2.1.0",
    "structlog>=23.0.0",
    "prometheus-client>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.2.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "hypothesis>=6.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"

[dependency-groups]
dev = [
    "ruff>=0.13.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.2.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "hypothesis>=6.0.0",
]
